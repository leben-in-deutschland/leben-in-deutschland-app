name: Idea
description: Something the app should do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would help you?
      description: Describe the situation - what are you trying to do while you prepare for the test, and what is in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the app solve it? You can leave this empty.
    validations:
      required: false
