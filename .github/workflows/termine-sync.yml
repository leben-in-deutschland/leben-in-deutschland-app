name: Exam dates sync

# Reads the public course pages of the exam centres in
# src/termine/sources.json (src/termine/sync.mjs, ADR-050) and publishes the
# result as termine.json on the `data` branch. The apps download that file
# from GitHub; the website serves it from its own origin (src/web/vercel.json).
#
# No secret: the job only sends GET requests to the centres' websites and
# pushes with the workflow's own token. Nothing lands on `main`, so nothing
# is built or deployed. A run that fails writes nothing; the published file
# stays as it was.

on:
  schedule:
    # 05:17, 09:17, 13:17 and 17:17 UTC - four reads a day, an hour or two
    # later on a clock in Germany. Not on the hour, when GitHub is busiest.
    - cron: "17 5,9,13,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termine-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the published file
        run: |
          mkdir -p previous
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git show FETCH_HEAD:termine.json > previous/termine.json || rm -f previous/termine.json
          else
            echo "No data branch yet; this run creates it."
          fi

      - name: Read the exam centres
        # The script prints one line - how many centres answered, how many dates - which becomes the commit message.
        run: |
          mkdir -p published
          node src/termine/sync.mjs --previous previous/termine.json --out published/termine.json > published/summary.txt
          cat published/summary.txt

      - name: Publish on the data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git worktree add --detach data-tree FETCH_HEAD
          else
            git worktree add --detach data-tree
            git -C data-tree checkout --orphan data
            git -C data-tree rm -r --force --quiet .
          fi
          cp published/termine.json data-tree/termine.json
          cp src/termine/data-branch.md data-tree/README.md
          cd data-tree
          git add termine.json README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit --quiet -m "termine: $(cat ../published/summary.txt)"
          git push origin HEAD:refs/heads/data
