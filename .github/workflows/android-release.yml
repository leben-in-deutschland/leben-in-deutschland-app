name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: src
        run: make build-sync

      - name: Run Tests
        working-directory: src/web
        run: npm test

      - name: Install Java & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Make Gradle Wrapper Executable
        run: chmod +x src/android/gradlew

      - name: Get Version from Package.json
        id: get_version
        working-directory: src/web
        run: |
          echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Bump version
        uses: chkfung/android-version-actions@v1.2.2
        with:
          gradlePath: src/android/app/build.gradle
          versionCode: ${{github.run_number}}
          versionName: ${{ env.VERSION }}

      - name: Build APK and AAB
        working-directory: src/android
        run: ./gradlew bundleRelease

      - name: Sign App
        id: sign_app
        uses: ilharp/sign-android-release@v1.0.4
        with:
          releaseDir: src/android/app/build/outputs/bundle/release
          signingKey: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Verify Signed App Bundle
        env:
          SIGNED_AAB: ${{ steps.sign_app.outputs.signedFile }}
          EXPECTED_SIGNING_SHA1: DE:8C:92:1E:CE:44:26:6D:5E:55:A0:08:3E:9D:E3:8D:C5:60:57:D0
        run: |
          set -euo pipefail

          if [ ! -f "$SIGNED_AAB" ]; then
            echo "::error::The signing action did not produce the expected app bundle."
            exit 1
          fi

          if ! verification_output="$(jarsigner -verify "$SIGNED_AAB" 2>&1)"; then
            echo "::error::The Android App Bundle signature is invalid."
            echo "$verification_output"
            exit 1
          fi

          if ! grep -Fq "jar verified." <<<"$verification_output"; then
            echo "::error::The Android App Bundle is not signed."
            exit 1
          fi

          certificate_output="$(keytool -printcert -jarfile "$SIGNED_AAB" 2>&1)"
          actual_sha1="$(printf '%s\n' "$certificate_output" | awk '/SHA1:/{print $2; exit}')"

          if [ "$actual_sha1" != "$EXPECTED_SIGNING_SHA1" ]; then
            echo "::error::Unexpected Android signing certificate SHA-1: $actual_sha1"
            exit 1
          fi

          echo "Verified Android signing certificate SHA-1: $actual_sha1"

      - name: Upload Signed AAB as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-App-Signed
          path: ${{ steps.sign_app.outputs.signedFile }}
          if-no-files-found: error

  release:
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Signed AAB
        uses: actions/download-artifact@v4
        with:
          name: Android-App-Signed
          path: src/android/app/build/outputs/bundle/release/

      - name: Get Version from Package.json
        id: get_version
        working-directory: src/web
        run: |
          echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "Einbürgerungstest v${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: src/android/app/build/outputs/bundle/release/app-release-signed.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
